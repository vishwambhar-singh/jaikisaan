name: Deploy JaiKisaan Solar

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: jaikisaansolar-production
  cancel-in-progress: true

jobs:
  deploy:
    name: Build & Deploy to EC2
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Prepare deployment directory
        if: ${{ secrets.DEPLOY_HOST != '' }}
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          script: |
            set -e
            mkdir -p /opt/apps/jaikisaansolar-website/frontend
            find /opt/apps/jaikisaansolar-website/frontend -mindepth 1 -maxdepth 1 -exec rm -rf {} +

      - name: Copy frontend to EC2
        if: ${{ secrets.DEPLOY_HOST != '' }}
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          source: "dist/*"
          target: "/opt/apps/jaikisaansolar-website/frontend"
          strip_components: 1
          overwrite: true
